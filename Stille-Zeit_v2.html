<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Stille-Zeit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Cinzel:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:         #08060a;
    --surface:    #100c14;
    --accent:     #9b3a5a;
    --accent-lt:  #c45c7a;
    --accent-dim: #5a2236;
    --purple:     #6b3480;
    --purple-lt:  #9156a8;
    --ivory:      #ede0e8;
    --ivory-dim:  #7a6a74;
    --text:       #d4c0cc;
    --ph1-col:    #b04060;
    --ph2-col:    #7a3896;
    --tr:         0.7s cubic-bezier(0.4,0,0.2,1);
  }

  html, body {
    height: 100%; overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'Cormorant Garamond', Georgia, serif;
    -webkit-tap-highlight-color: transparent;
  }

  body::before {
    content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.75' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.07'/%3E%3C/svg%3E");
    opacity:0.4;
  }

  .blob { position:fixed; border-radius:50%; filter:blur(70px); pointer-events:none; z-index:0; }
  .blob-1 {
    width:70vw; height:70vw; top:-20%; left:-20%;
    background:radial-gradient(circle, rgba(155,58,90,0.18) 0%, transparent 70%);
  }
  .blob-2 {
    width:60vw; height:60vw; bottom:-15%; right:-15%;
    background:radial-gradient(circle, rgba(107,52,128,0.18) 0%, transparent 70%);
  }

  #app {
    position:relative; z-index:1;
    height:100vh; display:flex;
    flex-direction:column; align-items:center; justify-content:flex-start;
    padding: 0 0 env(safe-area-inset-bottom,0);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }

  /* ══════════════════════════════════
     SETTINGS
  ══════════════════════════════════ */
  #settings {
    width:100%; max-width:400px;
    display:flex; flex-direction:column; gap:1.4rem;
    padding: 2rem 1.4rem 2.4rem;
    animation: fadeUp 0.7s ease both;
  }
  #settings.hidden { animation: fadeOut 0.45s ease forwards; }

  .panel-title {
    font-family:'Cinzel',serif;
    font-size:1.35rem;
    letter-spacing:0.3em;
    color:var(--accent-lt);
    text-align:center;
    text-transform:uppercase;
    padding-top:0.4rem;
  }
  .panel-sub {
    text-align:center;
    font-size:0.95rem; font-style:italic;
    color:var(--ivory-dim);
    letter-spacing:0.06em;
    margin-top:-0.8rem;
  }

  .setting-group {
    background:rgba(255,255,255,0.025);
    border:1px solid rgba(155,58,90,0.18);
    border-radius:14px;
    padding:1.2rem 1.2rem 1.4rem;
    display:flex; flex-direction:column; gap:1rem;
  }
  .setting-label {
    font-family:'Cinzel',serif;
    font-size:0.68rem; letter-spacing:0.22em;
    color:var(--accent-dim);
    text-transform:uppercase;
  }

  .sliders-row {
    display:flex; gap:1rem; justify-content:center; align-items:stretch;
  }
  .slider-col {
    flex:1; display:flex; flex-direction:column;
    align-items:center; gap:0.7rem;
  }
  .slider-col-name {
    font-size:0.82rem; color:var(--ivory-dim);
    text-align:center; font-style:italic; line-height:1.35;
  }
  .slider-val-big {
    font-family:'Cinzel',serif;
    font-size:1.5rem; color:var(--accent-lt);
    line-height:1;
  }
  .slider-val-unit {
    font-size:0.68rem; color:var(--ivory-dim); letter-spacing:0.1em;
  }

  .v-range-wrap {
    height:120px; display:flex; align-items:center; justify-content:center;
    position:relative;
  }
  input[type=range].vertical {
    -webkit-appearance:none;
    writing-mode:vertical-lr;
    direction:rtl;
    width:4px; height:110px;
    background:linear-gradient(to top,
      var(--accent) 0%,
      var(--accent) var(--pct,25%),
      rgba(155,58,90,0.15) var(--pct,25%));
    border-radius:99px; outline:none; cursor:pointer;
    appearance: slider-vertical;
  }
  input[type=range].vertical::-webkit-slider-container { writing-mode: vertical-lr; }
  input[type=range].vertical::-webkit-slider-runnable-track { width:4px; background:transparent; }
  input[type=range].vertical::-webkit-slider-thumb {
    -webkit-appearance:none;
    width:22px; height:22px; border-radius:50%;
    background:var(--accent-lt);
    box-shadow:0 0 12px rgba(155,58,90,0.6);
    margin-left:-9px;
    transition:transform 0.15s;
  }
  input[type=range].vertical::-webkit-slider-thumb:active { transform:scale(1.2); }
  input[type=range].vertical::-moz-range-thumb {
    width:22px; height:22px; border-radius:50%; border:none;
    background:var(--accent-lt);
    box-shadow:0 0 12px rgba(155,58,90,0.6);
  }

  .order-col { display:flex; flex-direction:column; gap:0.6rem; }
  .order-opt {
    width:100%; padding:0.7rem 0.9rem;
    border-radius:9px;
    border:1px solid rgba(155,58,90,0.18);
    cursor:pointer; font-family:'Cormorant Garamond',serif;
    font-size:0.9rem; color:var(--ivory-dim);
    text-align:left; line-height:1.4;
    background:transparent;
    transition:all 0.25s;
    display:flex; align-items:center; gap:0.6rem;
  }
  .order-opt .opt-num {
    font-family:'Cinzel',serif;
    font-size:0.6rem; letter-spacing:0.15em;
    color:var(--accent-dim);
    white-space:nowrap;
    flex-shrink:0;
  }
  .order-opt.active {
    background:rgba(155,58,90,0.12);
    border-color:var(--accent);
    color:var(--ivory);
  }

  .btn-start {
    width:100%; padding:0.95rem;
    border:none; border-radius:11px;
    font-family:'Cinzel',serif;
    font-size:0.9rem; letter-spacing:0.28em;
    text-transform:uppercase; cursor:pointer;
    background:linear-gradient(135deg, #7d2040, #b04060, #7d2040);
    color:#ede0e8;
    box-shadow:0 4px 28px rgba(155,58,90,0.35);
    transition:transform 0.2s, box-shadow 0.2s;
  }
  .btn-start:active { transform:scale(0.97); }

  /* ══════════════════════════════════
     TIMER VIEW
  ══════════════════════════════════ */
  #timer-view {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    padding:1.5rem 1.2rem;
    opacity:0; pointer-events:none;
    transition:opacity var(--tr);
  }
  #timer-view.visible { opacity:1; pointer-events:all; }

  /* Bildschirm-Hintergrundsäule (Verlauf von oben nach unten) */
  #progress-bg {
    position:fixed; inset:0; z-index:0;
    pointer-events:none;
    background: linear-gradient(to bottom, #b04060, #7a3896);
    transform: translateY(-100%);
    transition: transform 1s linear;
  }

  .ripple {
    position:fixed; inset:0; z-index:4;
    pointer-events:none; background:white; opacity:0;
    animation:rippleFlash 0.85s ease forwards;
  }
  @keyframes rippleFlash {
    0%   { opacity:0.2; }
    100% { opacity:0; }
  }

  .timer-inner {
    position:relative; z-index:3;
    text-align:center;
    display:flex; flex-direction:column;
    align-items:center; gap:1.1rem;
    width:100%; max-width:360px;
  }

  .phase-dots { display:flex; gap:0.6rem; }
  .dot {
    width:7px; height:7px; border-radius:50%;
    background:rgba(155,58,90,0.2);
    transition:all 0.45s;
  }
  .dot.active {
    background:var(--accent-lt);
    box-shadow:0 0 8px rgba(155,58,90,0.7);
    transform:scale(1.35);
  }
  .dot.done { background:rgba(155,58,90,0.45); }

  #phase-label {
    font-family:'Cinzel',serif;
    font-size:0.68rem; letter-spacing:0.3em;
    color:var(--accent-dim); text-transform:uppercase;
  }

  .clock-wrap {
    position:relative;
    display:inline-flex; align-items:center; justify-content:center;
    width:min(72vw, 280px); height:min(72vw, 280px);
  }
  .arc-svg { position:absolute; inset:0; width:100%; height:100%; }
  .arc-bg { stroke:rgba(255,255,255,0.08); }
  .arc-fill {
    stroke: #ede0e8;
    stroke-linecap:round;
    filter:drop-shadow(0 0 5px rgba(255,255,255,0.4));
    transition:stroke-dashoffset 1.05s linear;
    transform-origin:center;
    transform:rotate(-90deg);
  }
  #clock {
    font-family:'Cormorant Garamond',serif;
    font-size:clamp(3.2rem, 14vw, 5.5rem);
    font-weight:300; line-height:1;
    letter-spacing:-0.02em;
    color:var(--ivory);
    transition:color 0.5s;
    position:relative; z-index:1;
  }
  #clock.urgent {
    color:#e07070;
    text-shadow:0 0 30px rgba(224,112,112,0.35);
    animation:pulse 1s ease infinite;
  }
  @keyframes pulse {
    0%,100% { transform:scale(1); }
    50%      { transform:scale(1.015); }
  }

  #phase-heading {
    font-size:clamp(1.3rem, 5.5vw, 2rem);
    font-weight:300; color:var(--ivory);
    letter-spacing:0.03em; line-height:1.2;
    transition:all 0.55s;
  }

  #next-info {
    font-size:0.82rem; font-style:italic;
    color:var(--ivory-dim); letter-spacing:0.07em;
    opacity:0.55; min-height:1.2em;
  }

  .btn-reset {
    background:transparent;
    border:1px solid rgba(255,255,255,0.2);
    border-radius:8px; padding:0.55rem 1.8rem;
    color:var(--ivory-dim);
    font-family:'Cinzel',serif;
    font-size:0.65rem; letter-spacing:0.2em;
    text-transform:uppercase; cursor:pointer;
    transition:all 0.3s; margin-top:0.4rem;
  }
  .btn-reset:active {
    border-color:var(--ivory); color:var(--ivory);
    background:rgba(255,255,255,0.08);
  }

  /* ══════════════════════════════════
     DONE
  ══════════════════════════════════ */
  #done-view {
    position:absolute; inset:0;
    display:flex; flex-direction:column;
    align-items:center; justify-content:center;
    gap:1.5rem; z-index:5;
    opacity:0; pointer-events:none;
    transition:opacity 1s ease;
    padding:2rem;
  }
  #done-view.visible { opacity:1; pointer-events:all; }
  .done-icon { font-size:3rem; animation:floatIcon 3s ease-in-out infinite; }
  @keyframes floatIcon { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }
  .done-title {
    font-family:'Cinzel',serif;
    font-size:1.3rem; letter-spacing:0.22em;
    color:var(--accent-lt); text-transform:uppercase;
  }
  .done-sub {
    font-size:1rem; font-style:italic;
    color:var(--ivory-dim); letter-spacing:0.06em; text-align:center;
  }

  @keyframes fadeUp {
    from { opacity:0; transform:translateY(22px); }
    to   { opacity:1; transform:translateY(0); }
  }
  @keyframes fadeOut {
    to { opacity:0; transform:translateY(-16px); }
  }
</style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div id="app">

  <div id="settings">
    <div class="panel-title">Stille-Zeit</div>
    <p class="panel-sub">Zwei Momente – Gebet &amp; Gespräch</p>

    <div class="setting-group">
      <div class="setting-label">Dauer der Phasen</div>
      <div class="sliders-row">

        <div class="slider-col">
          <div class="slider-val-big" id="val1-big">15</div>
          <div class="slider-val-unit">min</div>
          <div class="v-range-wrap">
            <input type="range" class="vertical" id="slider1"
                   min="0" max="30" value="15"
                   oninput="updateSlider(this,0)">
          </div>
          <div class="slider-col-name">Betendes<br>Bibellesen</div>
        </div>

        <div class="slider-col">
          <div class="slider-val-big" id="val2-big">10</div>
          <div class="slider-val-unit">min</div>
          <div class="v-range-wrap">
            <input type="range" class="vertical" id="slider2"
                   min="0" max="30" value="10"
                   oninput="updateSlider(this,1)">
          </div>
          <div class="slider-col-name">Gebet<br>mit Papa</div>
        </div>

      </div>
    </div>

    <div class="setting-group">
      <div class="setting-label">Reihenfolge</div>
      <div class="order-col">
        <button class="order-opt active" id="opt-AB" onclick="setOrder('AB')">
          <span class="opt-num">1 →</span>
          Bibellesen → Gebet
        </button>
        <button class="order-opt" id="opt-BA" onclick="setOrder('BA')">
          <span class="opt-num">1 →</span>
          Gebet → Bibellesen
        </button>
      </div>
    </div>

    <button class="btn-start" onclick="startTimer()">▶ &nbsp; Starten</button>
  </div>

  <div id="timer-view">
    <div id="progress-bg"></div>

    <div class="timer-inner">
      <div class="phase-dots">
        <div class="dot" id="dot0"></div>
        <div class="dot" id="dot1"></div>
      </div>
      <div id="phase-label">Phase 1 von 2</div>

      <div class="clock-wrap">
        <svg class="arc-svg" viewBox="0 0 200 200">
          <circle class="arc-bg"   cx="100" cy="100" r="88" fill="none" stroke-width="1.5"/>
          <circle class="arc-fill" id="arc" cx="100" cy="100" r="88" fill="none" stroke-width="2"
                  stroke-dasharray="553" stroke-dashoffset="0"/>
        </svg>
        <div id="clock">15:00</div>
      </div>

      <div id="phase-heading">Betendes Bibellesen</div>
      <div id="next-info"></div>
      <button class="btn-reset" onclick="resetTimer()">↺ &nbsp; Zurücksetzen</button>
    </div>
  </div>

  <div id="done-view">
    <div class="done-icon">✦</div>
    <div class="done-title">Vollendet</div>
    <div class="done-sub">Beide Phasen sind abgeschlossen.</div>
    <button class="btn-reset" onclick="resetTimer()">↺ &nbsp; Erneut starten</button>
  </div>

</div>

<script>
const PHASES = [
  { name:'Betendes Bibellesen',  color:'#b04060' },
  { name:'Gebet mit Papa', color:'#7a3896' }
];

let order = 'AB';
let durations = [15, 10];
let phaseSeq = [];
let curPhase = 0;
let remaining = 0;
let total = 0;
let ticker = null;
let audioCtx = null;

function updateSlider(el, idx) {
  const v = parseInt(el.value);
  durations[idx] = v;
  document.getElementById('val' + (idx+1) + '-big').textContent = v;
  const pct = (v / 30 * 100).toFixed(1) + '%';
  el.style.setProperty('--pct', pct);
}

['slider1','slider2'].forEach((id,i) => {
  const el = document.getElementById(id);
  el.style.setProperty('--pct', (parseInt(el.value)/30*100).toFixed(1)+'%');
});

function setOrder(o) {
  order = o;
  document.getElementById('opt-AB').classList.toggle('active', o==='AB');
  document.getElementById('opt-BA').classList.toggle('active', o==='BA');
}

function initAudio() {
  if (audioCtx) return;
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}
function playChime(type) {
  if (!audioCtx) return;
  const notes = type==='done' ? [523.25,659.25,783.99,1046.5] : [783.99,1046.5];
  notes.forEach((freq,i) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.type = 'sine'; osc.frequency.value = freq;
    const t = audioCtx.currentTime + i * 0.18;
    gain.gain.setValueAtTime(0,t);
    gain.gain.linearRampToValueAtTime(0.12, t+0.04);
    gain.gain.exponentialRampToValueAtTime(0.0001, t+1.2);
    osc.start(t); osc.stop(t+1.2);
  });
}

function startTimer() {
  initAudio();
  phaseSeq = order==='AB' ? [0,1] : [1,0];
  curPhase = 0;
  beginPhase();
  const s = document.getElementById('settings');
  s.classList.add('hidden');
  setTimeout(()=>{ s.style.display='none'; }, 480);
  document.getElementById('timer-view').classList.add('visible');
}

function beginPhase() {
  const pi = phaseSeq[curPhase];
  const phase = PHASES[pi];
  total = durations[pi] * 60;
  remaining = total;

  document.getElementById('phase-heading').textContent = phase.name;
  document.getElementById('phase-label').textContent = `Phase ${curPhase+1} von ${phaseSeq.length}`;

  phaseSeq.forEach((_,i) => {
    const d = document.getElementById('dot'+i);
    d.className = 'dot' + (i<curPhase?' done': i===curPhase?' active':'');
  });

  if (curPhase < phaseSeq.length - 1) {
    const nextPi = phaseSeq[curPhase+1];
    document.getElementById('next-info').textContent = 'Danach: ' + PHASES[nextPi].name;
  } else {
    document.getElementById('next-info').textContent = 'Letzte Phase';
  }

  updateClock();
  clearInterval(ticker);
  ticker = setInterval(tick, 1000);
}

function tick() {
  remaining--;
  if (remaining < 0) remaining = 0;
  updateClock();
  if (remaining === 0) { clearInterval(ticker); setTimeout(advancePhase, 800); }
}

function advancePhase() {
  curPhase++;
  if (curPhase < phaseSeq.length) {
    const rip = document.createElement('div');
    rip.className = 'ripple';
    document.getElementById('app').appendChild(rip);
    setTimeout(()=>rip.remove(), 950);
    playChime('phase');
    beginPhase();
  } else {
    clearInterval(ticker);
    playChime('done');
    document.getElementById('timer-view').classList.remove('visible');
    setTimeout(()=>{ document.getElementById('done-view').classList.add('visible'); }, 400);
  }
}

function updateClock() {
  const m = Math.floor(remaining/60);
  const s = remaining % 60;
  document.getElementById('clock').textContent =
    String(m).padStart(2,'0') + ':' + String(s).padStart(2,'0');
  document.getElementById('clock').classList.toggle('urgent', remaining<=10 && remaining>0);
  
  const offset = 553 * (1 - (total > 0 ? remaining/total : 1));
  document.getElementById('arc').style.strokeDashoffset = offset;

  // Hintergrund läuft von oben nach unten (0% oben, -100% versteckt)
  const percentDone = total > 0 ? ((total - remaining) / total) * 100 : 100;
  document.getElementById('progress-bg').style.transform = `translateY(${-100 + percentDone}%)`;
}

function resetTimer() {
  clearInterval(ticker); ticker = null;
  document.getElementById('timer-view').classList.remove('visible');
  document.getElementById('done-view').classList.remove('visible');
  const s = document.getElementById('settings');
  s.style.display = 'flex';
  s.classList.remove('hidden');
  s.style.animation = 'none';
  requestAnimationFrame(()=>{ s.style.animation=''; s.style.animationName='fadeUp'; });
  
  document.getElementById('progress-bg').style.transform = 'translateY(-100%)';
  document.getElementById('clock').textContent = '--:--';
  document.getElementById('clock').classList.remove('urgent');
  document.getElementById('arc').style.strokeDashoffset = 0;
}
</script>
</body>
</html>
