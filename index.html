<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Stille Zeit Timer - Ein moderner, minimalistischer Meditations-Timer für Gebet und Bibelarbeit mit flüssigen Animationen und beruhigenden Klangschalen.">
  <title>Stille Zeit Timer</title>
  
  <!-- iOS HOME SCREEN APP ICON -->
  <link rel="apple-touch-icon" href="Binokel.jpeg">
  <link rel="apple-touch-icon" sizes="152x152" href="Binokel.jpeg">
  <link rel="apple-touch-icon" sizes="180x180" href="Binokel.jpeg">
  <meta name="apple-mobile-web-app-title" content="Stille Zeit">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    /* SOFT MODERN NEON DESIGN TOKENS */
    :root {
      --bg-black: #050505;
      
      /* Softer, pastel-neon light tones */
      --neon-pink: #ff65a3;
      --neon-purple: #b666ff;
      --neon-red: #ff6b6b;
      
      /* Widely diffused, ambient glows (no harsh glare) */
      --glow-pink: 0 0 15px rgba(255, 101, 163, 0.35), 0 0 35px rgba(255, 101, 163, 0.15);
      --glow-purple: 0 0 15px rgba(182, 102, 255, 0.35), 0 0 35px rgba(182, 102, 255, 0.15);
      --glow-red: 0 0 15px rgba(255, 107, 107, 0.35), 0 0 35px rgba(255, 107, 107, 0.15);
      
      --glow-text-pink: 0 0 8px rgba(255, 101, 163, 0.5), 0 0 25px rgba(255, 101, 163, 0.2);
      --glow-text-purple: 0 0 8px rgba(182, 102, 255, 0.5), 0 0 25px rgba(182, 102, 255, 0.2);
      --glow-text-red: 0 0 8px rgba(255, 107, 107, 0.5), 0 0 25px rgba(255, 107, 107, 0.2);

      /* Elegant typography configuration */
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      --transition-slow: 1.2s cubic-bezier(0.25, 1, 0.5, 1);
      --transition-fast: 0.3s ease;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: #ffffff;
      font-family: var(--font-family);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      transition: background-color var(--transition-slow);
      position: relative;
      -webkit-font-smoothing: antialiased;
    }

    /* SOFT LIGHTING AMBIANCE */
    /* Dynamic screen-wide aura overlay */
    .ambient-glow {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(182, 102, 255, 0.12) 0%, rgba(255, 101, 163, 0.06) 50%, rgba(0,0,0,0) 80%);
      pointer-events: none;
      z-index: -2;
      opacity: 0;
      transition: opacity var(--transition-slow);
    }

    /* Full-screen rising vertical fill progress */
    .vertical-progress-bg {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(0deg, rgba(182, 102, 255, 0.02) 0%, rgba(255, 101, 163, 0.06) 100%);
      pointer-events: none;
      z-index: -1;
      border-top: 1px solid rgba(255, 101, 163, 0.15);
      box-shadow: 0 -8px 20px rgba(255, 101, 163, 0.08);
      transition: height 0.3s linear;
    }

    /* GLASS CONTAINER */
    .container {
      width: 90%;
      max-width: 440px;
      padding: 2.8rem;
      border-radius: 28px;
      background: rgba(8, 8, 8, 0.45);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid rgba(255, 255, 255, 0.05);
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);
      text-align: center;
      transition: opacity var(--transition-slow), transform var(--transition-slow);
      z-index: 10;
    }

    .hidden {
      display: none !important;
      opacity: 0;
      transform: scale(0.97);
    }

    /* MINIMALIST TYPOGRAPHY */
    h1 {
      font-size: 2.2rem;
      font-weight: 300;
      color: #ffffff;
      text-shadow: var(--glow-text-purple);
      margin-bottom: 1.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      transition: text-shadow var(--transition-slow);
    }

    .sub-headline {
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.4);
      margin-top: -1.4rem;
      margin-bottom: 2.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      font-weight: 500;
    }

    /* FORM ELEMENTS */
    .setup-group {
      margin-bottom: 2rem;
      text-align: left;
    }

    .setup-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .label-tag-prayer {
      color: var(--neon-pink);
      text-shadow: 0 0 5px rgba(255, 101, 163, 0.3);
    }

    .label-tag-bible {
      color: var(--neon-purple);
      text-shadow: 0 0 5px rgba(182, 102, 255, 0.3);
    }

    .time-value {
      font-size: 1rem;
      font-weight: 400;
      color: rgba(255, 255, 255, 0.9);
    }

    /* Thin modern sliders */
    .slider-container {
      position: relative;
      display: flex;
      align-items: center;
    }

    input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 2px;
      background: rgba(255, 255, 255, 0.08);
      outline: none;
    }

    /* Pink Slider (Prayer) */
    input[type="range"].slider-prayer::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--neon-pink);
      box-shadow: var(--glow-pink);
      cursor: pointer;
      transition: transform var(--transition-fast) ease;
    }
    input[type="range"].slider-prayer::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }
    input[type="range"].slider-prayer::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--neon-pink);
      box-shadow: var(--glow-pink);
      cursor: pointer;
    }

    /* Purple Slider (Bible) */
    input[type="range"].slider-bible::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--neon-purple);
      box-shadow: var(--glow-purple);
      cursor: pointer;
      transition: transform var(--transition-fast) ease;
    }
    input[type="range"].slider-bible::-webkit-slider-thumb:hover {
      transform: scale(1.3);
    }
    input[type="range"].slider-bible::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ffffff;
      border: 1px solid var(--neon-purple);
      box-shadow: var(--glow-purple);
      cursor: pointer;
    }

    /* ORDER RADIO SWITCH */
    .order-selector {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-top: 0.6rem;
    }

    .order-option {
      position: relative;
      cursor: pointer;
      display: block;
    }

    .order-option input {
      position: absolute;
      opacity: 0;
      width: 0;
      height: 0;
    }

    .order-card {
      padding: 0.8rem;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.01);
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all var(--transition-fast);
      text-align: center;
      color: rgba(255, 255, 255, 0.4);
    }

    .order-option input:checked + .order-card {
      background: rgba(182, 102, 255, 0.05);
      border-color: rgba(182, 102, 255, 0.6);
      box-shadow: var(--glow-purple);
      color: #ffffff;
      text-shadow: 0 0 3px rgba(255, 255, 255, 0.4);
    }

    /* START BUTTON */
    .btn {
      display: inline-block;
      width: 100%;
      padding: 1rem;
      margin-top: 1.5rem;
      background: transparent;
      border: 1px solid rgba(255, 101, 163, 0.6);
      color: #ffffff;
      border-radius: 14px;
      font-family: var(--font-family);
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      cursor: pointer;
      box-shadow: var(--glow-pink);
      text-shadow: 0 0 3px #ffffff;
      transition: all var(--transition-fast);
    }

    .btn:hover {
      background: rgba(255, 101, 163, 0.1);
      box-shadow: 0 0 20px rgba(255, 101, 163, 0.4);
      transform: translateY(-1px);
    }

    .btn:active {
      transform: translateY(1px);
    }

    /* SMOOTH CIRCULAR DISPLAY */
    .circle-container {
      position: relative;
      width: 260px;
      height: 260px;
      margin: 0.5rem auto 1.8rem auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .progress-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }

    .progress-ring-bg {
      stroke: rgba(255, 255, 255, 0.02);
      stroke-width: 3;
      fill: transparent;
    }

    .progress-ring-fg {
      stroke-width: 3;
      fill: transparent;
      stroke-linecap: round;
      transform: rotate(-90deg);
      transform-origin: 50% 50%;
      /* Transition is fast/none to allow butter-smooth requestAnimationFrame update */
      transition: stroke 0.8s ease, filter 0.8s ease;
    }

    .circle-inner-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 2;
      width: 90%;
    }

    .timer-title {
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: rgba(255, 255, 255, 0.35);
      margin-bottom: 0.4rem;
    }

    .timer-phase-name {
      font-size: 1.4rem;
      font-weight: 300;
      letter-spacing: 3px;
      margin-bottom: 0.8rem;
      text-transform: uppercase;
      text-shadow: var(--glow-text-pink);
      transition: text-shadow var(--transition-slow), color var(--transition-slow);
    }

    .timer-countdown {
      font-size: 3.8rem;
      font-weight: 200;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      letter-spacing: -1px;
    }

    /* CONTROL BUTTONS */
    .timer-controls {
      display: flex;
      width: 100%;
      justify-content: center;
      margin-top: 0.5rem;
    }

    .btn-control-reset {
      width: 75%;
      padding: 0.8rem;
      background: transparent;
      border: 1px solid rgba(255, 107, 107, 0.4);
      color: rgba(255, 255, 255, 0.8);
      font-family: var(--font-family);
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 0 5px rgba(255, 107, 107, 0.1);
      transition: all var(--transition-fast);
    }

    .btn-control-reset:hover {
      background: rgba(255, 107, 107, 0.15);
      border-color: var(--neon-red);
      box-shadow: var(--glow-red);
      color: #ffffff;
    }

    /* STAGE INDICATORS */
    .phase-indicator-row {
      display: flex;
      justify-content: center;
      gap: 0.8rem;
      margin-bottom: 1.5rem;
      width: 100%;
    }

    .phase-badge {
      padding: 0.35rem 0.9rem;
      border-radius: 20px;
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      border: 1px solid rgba(255, 255, 255, 0.03);
      background: rgba(255, 255, 255, 0.01);
      color: rgba(255, 255, 255, 0.3);
      transition: all var(--transition-slow);
    }

    .phase-badge.active-prayer {
      border-color: rgba(255, 101, 163, 0.4);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(255, 101, 163, 0.2);
      background: rgba(255, 101, 163, 0.02);
    }

    .phase-badge.active-bible {
      border-color: rgba(182, 102, 255, 0.4);
      color: #ffffff;
      box-shadow: 0 0 10px rgba(182, 102, 255, 0.2);
      background: rgba(182, 102, 255, 0.02);
    }

    /* CALM, BREATHING START BUTTON GLOW */
    @keyframes breathing-glow {
      0% {
        box-shadow: 0 0 12px rgba(255, 101, 163, 0.25), 0 0 25px rgba(255, 101, 163, 0.1);
        border-color: rgba(255, 101, 163, 0.4);
      }
      50% {
        box-shadow: 0 0 18px rgba(255, 101, 163, 0.45), 0 0 35px rgba(255, 101, 163, 0.2);
        border-color: rgba(255, 101, 163, 0.75);
      }
      100% {
        box-shadow: 0 0 12px rgba(255, 101, 163, 0.25), 0 0 25px rgba(255, 101, 163, 0.1);
        border-color: rgba(255, 101, 163, 0.4);
      }
    }

    .pulse-btn {
      animation: breathing-glow 7s infinite ease-in-out;
    }

    /* RESPONSIVENESS */
    @media (max-width: 480px) {
      .container {
        padding: 2.2rem 1.8rem;
        width: 95%;
      }
      h1 {
        font-size: 1.8rem;
      }
      .circle-container {
        width: 220px;
        height: 220px;
      }
      .timer-countdown {
        font-size: 3.2rem;
      }
      .timer-phase-name {
        font-size: 1.2rem;
      }
      .order-selector {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }
  </style>
</head>
<body>

  <!-- LIGHTING AMBIANCE -->
  <div class="ambient-glow" id="ambient-glow"></div>
  <div class="vertical-progress-bg" id="progress-bg"></div>

  <!-- SETUP SCREEN -->
  <div class="container" id="setup-screen">
    <h1>Stille Zeit</h1>
    <div class="sub-headline">Meditation & Besinnung</div>

    <!-- PRAYER TIME INPUT -->
    <div class="setup-group">
      <div class="setup-label">
        <span class="label-tag-prayer">Gebetszeit</span>
        <span class="time-value" id="val-prayer">10 min</span>
      </div>
      <div class="slider-container">
        <input type="range" class="slider-prayer" id="input-prayer" min="1" max="20" value="10" aria-label="Gebetszeit in Minuten">
      </div>
    </div>

    <!-- BIBLE READ TIME INPUT -->
    <div class="setup-group">
      <div class="setup-label">
        <span class="label-tag-bible">Bibel Lesen</span>
        <span class="time-value" id="val-bible">10 min</span>
      </div>
      <div class="slider-container">
        <input type="range" class="slider-bible" id="input-bible" min="1" max="20" value="10" aria-label="Bibellesezeit in Minuten">
      </div>
    </div>

    <!-- ORDER SELECTOR -->
    <div class="setup-group">
      <div class="setup-label" style="margin-bottom: 0.5rem;">Reihenfolge</div>
      <div class="order-selector">
        <label class="order-option">
          <input type="radio" name="timer-order" value="bible-first" checked>
          <div class="order-card">1. Bibel / 2. Gebet</div>
        </label>
        <label class="order-option">
          <input type="radio" name="timer-order" value="prayer-first">
          <div class="order-card">1. Gebet / 2. Bibel</div>
        </label>
      </div>
    </div>

    <!-- START BUTTON -->
    <button class="btn pulse-btn" id="btn-start">Starten</button>
  </div>

  <!-- TIMER SCREEN -->
  <div class="container hidden" id="timer-screen">
    <div class="phase-indicator-row">
      <div class="phase-badge" id="badge-p1">Phase 1</div>
      <div class="phase-badge" id="badge-p2">Phase 2</div>
    </div>

    <!-- CIRCULAR TIMER DISPLAY -->
    <div class="circle-container">
      <svg class="progress-ring">
        <circle class="progress-ring-bg" cx="130" cy="130" r="115" id="circle-bg" />
        <circle class="progress-ring-fg" cx="130" cy="130" r="115" id="circle-fg" />
      </svg>
      <div class="circle-inner-content">
        <div class="timer-title">Aktuell</div>
        <div class="timer-phase-name" id="timer-phase-name">BIBEL LESEN</div>
        <div class="timer-countdown" id="timer-countdown">10:00</div>
      </div>
    </div>

    <!-- MINIMALIST RESET BUTTON ONLY -->
    <div class="timer-controls">
      <button class="btn-control-reset" id="btn-reset">Zurücksetzen</button>
    </div>
  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // DOM Elements
    const setupScreen = document.getElementById('setup-screen');
    const timerScreen = document.getElementById('timer-screen');
    const inputPrayer = document.getElementById('input-prayer');
    const inputBible = document.getElementById('input-bible');
    const valPrayer = document.getElementById('val-prayer');
    const valBible = document.getElementById('val-bible');
    const btnStart = document.getElementById('btn-start');
    
    const timerPhaseName = document.getElementById('timer-phase-name');
    const timerCountdown = document.getElementById('timer-countdown');
    const badgeP1 = document.getElementById('badge-p1');
    const badgeP2 = document.getElementById('badge-p2');

    const btnReset = document.getElementById('btn-reset');

    const ambientGlow = document.getElementById('ambient-glow');
    const progressBg = document.getElementById('progress-bg');
    
    const circleFg = document.getElementById('circle-fg');
    const circleBg = document.getElementById('circle-bg');

    // SVG Circular Calculations
    let radius = 115;
    let circumference = 2 * Math.PI * radius; // 722.56

    // Initialize SVG dash properties
    circleFg.style.strokeDasharray = `${circumference} ${circumference}`;
    circleFg.style.strokeDashoffset = 0; // Starts full

    // Adjust SVG layout dynamically on window resize
    function handleResize() {
      const isMobile = window.innerWidth <= 480;
      const r = isMobile ? 95 : 115;
      const c = 2 * Math.PI * r;
      
      const newCxCy = isMobile ? 110 : 130;
      
      circleFg.setAttribute('cx', newCxCy);
      circleFg.setAttribute('cy', newCxCy);
      circleFg.setAttribute('r', r);
      circleBg.setAttribute('cx', newCxCy);
      circleBg.setAttribute('cy', newCxCy);
      circleBg.setAttribute('r', r);
      
      circleFg.style.strokeDasharray = `${c} ${c}`;
      radius = r;
      circumference = c;
      return c;
    }
    
    window.addEventListener('resize', handleResize);
    // Execute initially to set the exact dimensions
    handleResize();

    // Dynamic sliders value updater
    inputPrayer.addEventListener('input', (e) => {
      valPrayer.textContent = `${e.target.value} min`;
    });

    inputBible.addEventListener('input', (e) => {
      valBible.textContent = `${e.target.value} min`;
    });

    // Audio & Frame variables
    let audioCtx = null;
    let animationFrameId = null;
    let startTimestamp = null;
    
    let originalPrayerMin = 10;
    let originalBibleMin = 10;
    
    let sequence = [];
    let currentIdx = 0;
    let totalSessionSec = 0; 
    let cumulativeElapsedMs = 0;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    /**
     * Meditative Tibetan Singing Bowl Synthesizer (Enhanced - Softer & Calmer)
     * Generates a deeper, quiet resonance with a very slow fade-in and minimal overtones.
     */
    function triggerSingingBowl(fundamental, duration = 4.5, delay = 0) {
      if (!audioCtx) return;

      const startTime = audioCtx.currentTime + delay;
      
      // Detuned physical harmonics for singing-bowl richness (reduced overtone volume for extreme softness)
      const harmonics = [
        { ratio: 1.0,  amp: 0.35, decayMult: 1.0 },   // Deep fundamental warm hum
        { ratio: 1.19, amp: 0.08, decayMult: 0.8 },   // Consonant minor third (very quiet)
        { ratio: 1.50, amp: 0.12, decayMult: 0.7 },   // Calm fifth (subtle)
        { ratio: 2.00, amp: 0.04, decayMult: 0.5 }    // Soft octave (barely audible)
      ];

      // Master output gain envelope
      const masterGain = audioCtx.createGain();
      masterGain.gain.setValueAtTime(0, startTime);
      
      // Extremely slow attack (0.6 seconds) makes the onset swell like a soft breath
      masterGain.gain.linearRampToValueAtTime(0.25, startTime + 0.6);
      masterGain.gain.setValueAtTime(0.25, startTime + 0.6);
      masterGain.gain.exponentialRampToValueAtTime(0.0001, startTime + duration);

      harmonics.forEach(harmonic => {
        const osc = audioCtx.createOscillator();
        const subGain = audioCtx.createGain();
        
        osc.type = 'sine';
        osc.frequency.setValueAtTime(fundamental * harmonic.ratio, startTime);
        
        // Decay amplitude envelope
        subGain.gain.setValueAtTime(harmonic.amp, startTime);
        subGain.gain.exponentialRampToValueAtTime(0.0001, startTime + (duration * harmonic.decayMult));
        
        osc.connect(subGain);
        subGain.connect(masterGain);
        
        osc.start(startTime);
        osc.stop(startTime + duration + 0.5);
      });

      masterGain.connect(audioCtx.destination);
    }

    // Play meditative bowl chime exactly twice
    function playChime(isFinal = false) {
      initAudio();
      if (!audioCtx) return;
      
      if (!isFinal) {
        // Intermediate transition bowl: Deep E3 (164.81 Hz - very soothing and grounded)
        triggerSingingBowl(164.81, 4.2, 0);
        
        // Repeat exactly twice, after 2.0 seconds
        setTimeout(() => {
          triggerSingingBowl(164.81, 4.2, 0);
        }, 2000);
      } else {
        // Final completion bowl: Deep D3 (146.83 Hz - even lower and resting)
        triggerSingingBowl(146.83, 5.2, 0);

        // Repeat exactly twice, after 2.5 seconds
        setTimeout(() => {
          triggerSingingBowl(146.83, 5.2, 0);
        }, 2500);
      }
    }

    // Format MM:SS helper
    function formatTime(sec) {
      const mins = Math.floor(sec / 60);
      const secs = sec % 60;
      return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
    }

    // Smooth animation frame loop
    function animate(timestamp) {
      if (!startTimestamp) startTimestamp = timestamp;
      
      // Time elapsed in the current active phase (in ms)
      const elapsedMs = timestamp - startTimestamp;
      
      const activePhase = sequence[currentIdx];
      const phaseTotalMs = activePhase.durationSec * 1000;
      
      // Calculate remaining ms
      const phaseTimeLeftMs = Math.max(0, phaseTotalMs - elapsedMs);
      
      // 1. Text countdown display (calm whole seconds)
      const displaySeconds = Math.ceil(phaseTimeLeftMs / 1000);
      timerCountdown.textContent = formatTime(displaySeconds);
      
      // 2. BUTTERY SMOOTH Progress Ring (Kreis der flüssig abläuft)
      const phaseFraction = phaseTimeLeftMs / phaseTotalMs;
      const dashoffset = circumference * (1 - phaseFraction);
      circleFg.style.strokeDashoffset = dashoffset;
      
      // 3. Fluid background progressions
      const totalElapsedMs = cumulativeElapsedMs + elapsedMs;
      const totalSessionMs = totalSessionSec * 1000;
      const overallProgressFraction = Math.min(1, totalElapsedMs / totalSessionMs);
      
      ambientGlow.style.opacity = (overallProgressFraction * 0.65).toFixed(4);
      progressBg.style.height = `${(overallProgressFraction * 100).toFixed(2)}%`;
      
      // Active styling modifications based on phase
      if (activePhase.id === 'prayer') {
        timerPhaseName.style.color = 'var(--neon-pink)';
        timerPhaseName.style.textShadow = 'var(--glow-text-pink)';
        circleFg.style.stroke = 'var(--neon-pink)';
        circleFg.style.filter = 'drop-shadow(0 0 10px rgba(255, 101, 163, 0.45))';
        progressBg.style.borderTopColor = 'rgba(255, 101, 163, 0.25)';
        progressBg.style.boxShadow = '0 -8px 20px rgba(255, 101, 163, 0.1)';
      } else {
        timerPhaseName.style.color = 'var(--neon-purple)';
        timerPhaseName.style.textShadow = 'var(--glow-text-purple)';
        circleFg.style.stroke = 'var(--neon-purple)';
        circleFg.style.filter = 'drop-shadow(0 0 10px rgba(182, 102, 255, 0.45))';
        progressBg.style.borderTopColor = 'rgba(182, 102, 255, 0.25)';
        progressBg.style.boxShadow = '0 -8px 20px rgba(182, 102, 255, 0.1)';
      }
      
      // Check phase transition
      if (phaseTimeLeftMs <= 0) {
        if (currentIdx < sequence.length - 1) {
          // Move from phase 1 to phase 2
          cumulativeElapsedMs += phaseTotalMs;
          currentIdx++;
          startTimestamp = performance.now();
          
          timerPhaseName.textContent = sequence[currentIdx].name;
          updatePhaseBadges();
          playChime(false);
          
          animationFrameId = requestAnimationFrame(animate);
        } else {
          // Finished the entire session
          animationFrameId = null;
          
          timerCountdown.textContent = "00:00";
          timerPhaseName.textContent = "FERTIG";
          timerPhaseName.style.color = 'var(--neon-red)';
          timerPhaseName.style.textShadow = 'var(--glow-text-red)';
          circleFg.style.stroke = 'var(--neon-red)';
          circleFg.style.filter = 'drop-shadow(0 0 10px rgba(255, 107, 107, 0.5))';
          circleFg.style.strokeDashoffset = circumference;
          
          playChime(true);
        }
      } else {
        // Continue animation loop
        animationFrameId = requestAnimationFrame(animate);
      }
    }

    // Badge setup
    function updatePhaseBadges() {
      badgeP1.textContent = sequence[0].name;
      badgeP2.textContent = sequence[1].name;

      badgeP1.className = 'phase-badge';
      badgeP2.className = 'phase-badge';

      if (currentIdx === 0) {
        badgeP1.classList.add(sequence[0].id === 'prayer' ? 'active-prayer' : 'active-bible');
      } else {
        badgeP2.classList.add(sequence[1].id === 'prayer' ? 'active-prayer' : 'active-bible');
      }
    }

    // Start timer process
    function startTimer() {
      initAudio();
      
      originalPrayerMin = parseInt(inputPrayer.value);
      originalBibleMin = parseInt(inputBible.value);
      
      const orderVal = document.querySelector('input[name="timer-order"]:checked').value;
      
      const prayerPhase = { name: 'Gebet', durationSec: originalPrayerMin * 60, id: 'prayer' };
      const biblePhase = { name: 'Bibel lesen', durationSec: originalBibleMin * 60, id: 'bible' };
      
      if (orderVal === 'prayer-first') {
        sequence = [prayerPhase, biblePhase];
      } else {
        sequence = [biblePhase, prayerPhase];
      }
      
      currentIdx = 0;
      totalSessionSec = sequence[0].durationSec + sequence[1].durationSec;
      cumulativeElapsedMs = 0;
      startTimestamp = null;
      
      timerPhaseName.textContent = sequence[currentIdx].name;
      
      // Update UI
      updatePhaseBadges();
      handleResize();
      
      // Screen transition
      setupScreen.classList.add('hidden');
      timerScreen.classList.remove('hidden');
      
      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      animationFrameId = requestAnimationFrame(animate);
    }

    btnStart.addEventListener('click', startTimer);

    // Reset timer action
    btnReset.addEventListener('click', () => {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
        animationFrameId = null;
      }
      
      // Smooth reset displays
      ambientGlow.style.opacity = '0';
      progressBg.style.height = '0%';
      circleFg.style.strokeDashoffset = 0;
      
      // Swap screens
      timerScreen.classList.add('hidden');
      setupScreen.classList.remove('hidden');
    });

  </script>
</body>
</html>
